name: Release (tag + publish on push main)

# Release automation only: derive the tag from pubspec.yaml, build the four APK
# sets, tag the commit, and publish the GitHub Release. Device-level validation
# (integration instruments) is done locally and is not repeated here.

on:
  push:
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from pubspec.yaml
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          RAW=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          BASE="${RAW%%+*}"        # 3.1.1
          BUILD="${RAW##*+}"       # 8  (if no +, will equal RAW)
          if [[ "$RAW" == "$BASE" ]]; then
            # no +buildNumber found; default b1
            BUILD="1"
          fi
          TAG="v${BASE}-b${BUILD}"
          echo "raw=$RAW" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Computed tag: $TAG"

      # The decision is based on the RELEASE, not only on the tag: a run that
      # pushed the tag but died before publishing (transient API failure, runner
      # timeout) must be retryable. In that state the tag is reused, the APKs are
      # rebuilt, and only the release is created.
      - name: Check whether this version is already published
        id: state
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists -> nothing to build or publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "Release $TAG not found -> building and publishing."
          fi
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "tagged=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists locally -> will be reused."
          else
            echo "tagged=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG does not exist -> will be created after the builds pass."
          fi

      - name: Skip (already published)
        if: steps.state.outputs.published == 'true'
        run: echo "::notice::${{ steps.ver.outputs.tag }} is already published — nothing to do."

      # Guard before the ten-minute build: android/app/build.gradle.kts falls back
      # to DEBUG signing when key.properties is absent or holds placeholder
      # values, so a missing secret would otherwise publish debug-signed APKs as
      # a real release.
      - name: Verify signing secrets are present
        if: steps.state.outputs.published == 'false'
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          missing=()
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} )); then
            echo "::error::Missing release signing secret(s): ${missing[*]}"
            exit 1
          fi
          echo "All four signing secrets are set."

      - name: Setup Java 17
        if: steps.state.outputs.published == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter (stable)
        if: steps.state.outputs.published == 'false'
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Cache Gradle
        if: steps.state.outputs.published == 'false'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode and write keystore
        if: steps.state.outputs.published == 'false'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/pindl-release.jks
          test -s android/app/pindl-release.jks

      - name: Write android/key.properties
        if: steps.state.outputs.published == 'false'
        shell: bash
        run: |
          set -euo pipefail
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=pindl-release.jks
          EOF

      - name: Flutter pub get
        if: steps.state.outputs.published == 'false'
        run: flutter pub get

      # One cheap host gate (~1 min, fully offline) so a tag is never created
      # from a red tree. It includes the version-consistency test that keeps
      # pubspec, About page, RELEASE_NOTES.md and CHANGELOG.md aligned.
      - name: Flutter test (host suite)
        if: steps.state.outputs.published == 'false'
        run: flutter test

      - name: Build lite (split per ABI)
        if: steps.state.outputs.published == 'false'
        run: flutter build apk --release --flavor lite --dart-define=ENABLE_FFMPEG=false --split-per-abi

      - name: Build ffmpeg (split per ABI)
        if: steps.state.outputs.published == 'false'
        run: flutter build apk --release --flavor ffmpeg --dart-define=ENABLE_FFMPEG=true --split-per-abi

      - name: Build lite (universal)
        if: steps.state.outputs.published == 'false'
        run: flutter build apk --release --flavor lite --dart-define=ENABLE_FFMPEG=false

      - name: Build ffmpeg (universal)
        if: steps.state.outputs.published == 'false'
        run: flutter build apk --release --flavor ffmpeg --dart-define=ENABLE_FFMPEG=true

      - name: Collect & rename APKs
        if: steps.state.outputs.published == 'false'
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.ver.outputs.base }}"
          BUILD="b${{ steps.ver.outputs.build }}"
          OUTDIR="dist"
          mkdir -p "$OUTDIR"

          APKDIR="build/app/outputs/flutter-apk"

          # Split-per-abi outputs:
          # Format Flutter: app-<abi>-<flavor>-release.apk
          for flavor in lite ffmpeg; do
            for abi in armeabi-v7a arm64-v8a x86_64; do
              src="${APKDIR}/app-${abi}-${flavor}-release.apk"

              if [[ -f "$src" ]]; then
                dst="${OUTDIR}/PinDL-${flavor}-${abi}-v${VERSION}-${BUILD}.apk"
                cp -v "$src" "$dst"
              else
                echo "File not found: $src"
              fi
            done
          done

          # Universal outputs:
          # app-<flavor>-release.apk
          for flavor in lite ffmpeg; do
            src="${APKDIR}/app-${flavor}-release.apk"
            if [[ -f "$src" ]]; then
              dst="${OUTDIR}/PinDL-${flavor}-universal-v${VERSION}-${BUILD}.apk"
              cp -v "$src" "$dst"
            fi
          done

          ls -alh "$OUTDIR"

          # Publishing needs every artifact; a rename mismatch must fail here,
          # not produce a release with missing APKs.
          count=$(find "$OUTDIR" -maxdepth 1 -name '*.apk' | wc -l)
          if [[ "$count" -ne 8 ]]; then
            echo "::error::Expected 8 APKs (2 flavors x 4 builds), found $count."
            exit 1
          fi

      - name: Create and push tag
        if: steps.state.outputs.published == 'false'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists -> reusing it."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release + upload artifacts
        if: steps.state.outputs.published == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: dist/*.apk
          fail_on_unmatched_files: true
